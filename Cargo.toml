[package]
name = "photonio"
version = "0.9.5"
edition = "2021"

[dependencies]
arboard = "3.6.1"
clipboard-win = "5.4.1"
# GUI framework (immediate-mode). Pulls in egui + winit + glow (OpenGL).
eframe = "0.28.1"

# Image decoding. Formats are selected explicitly to keep the binary lean,
# matching SPEC §2 (PNG, JPEG, WebP, GIF, BMP, ICO).
# Add via: cargo add image@0.25 --no-default-features --features png,jpeg,webp,gif,bmp,ico
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
kamadak-exif = "0.6"

# Natural (alphanumeric) sort so "img2" < "img10".
# Add via: cargo add natord@1.0
natord = "1.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.2.9"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
# Embeds the Windows executable icon via build.rs.
winres = "0.1"
